name: preview
on:
  workflow_call:
    inputs:
      publish:
        description: "The directory to publish to pkg.pr.new"
        default: "./packages/**"
        required: false
        type: string
      template:
        description: "The directory of templates to publish to StackBlitz"
        default: "./examples/**"
        required: false
        type: string

jobs:
  preview:
    if: github.repository_owner == 'bombshell-dev'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PNPM
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Build packages
        run: pnpm run build

      - name: Publish Preview
        env:
          TEMPLATE_GLOB: ${{ inputs.template }}
          PUBLISH_GLOB: ${{ inputs.publish }}
        run: pnpx pkg-pr-new publish --pnpm "$PUBLISH_GLOB" --template "$TEMPLATE_GLOB"
